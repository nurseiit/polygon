[package]
name = "wasm-library"
version = "0.1.0"
edition = "2024"


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fixedbitset = "0.5.7"
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[profile.release]
# optimize for small code size
opt-level = "s"
